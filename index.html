<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Kriyanusa Furniture — export manufacturing suite for an Indonesian furniture exporter: order intake, anggaran belanja, procurement, goods receipts, multi-warehouse inventory and the export document set."
    />
    <title>Kriyanusa Furniture — Export Manufacturing Suite</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c25510'/%3E%3Cpath d='M16 4.5 9 14h4l-5 7h6v6.5h4V21h6l-5-7h4z' fill='white'/%3E%3C/svg%3E" />
    <script>
      /* Resolve the theme before first paint, so a dark-mode user never sees a white flash. */
      (function () {
        try {
          var mode = localStorage.getItem('kn-theme') || 'system'
          var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
